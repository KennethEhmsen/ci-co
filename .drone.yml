kind: pipeline
type: docker
name: default

clone:
  disable: true

steps:
  - name: clone
    image: alpine/git
    commands:
      - git clone http://gitea:3000/localadmin/ci-co.git .
      - git checkout $DRONE_COMMIT

  - name: install-root
    image: node:20-alpine
    commands:
      - npm install --ignore-scripts
    depends_on:
      - clone

  - name: install-shared
    image: node:20-alpine
    commands:
      - cd shared
      - npm install
      - npm run build
    depends_on:
      - install-root

  - name: test-shared
    image: node:20-alpine
    commands:
      - cd shared
      - npm run test:coverage
    depends_on:
      - install-shared

  - name: install-mcp-server
    image: node:20-alpine
    commands:
      - cd mcp-server
      - npm install
    depends_on:
      - install-shared

  - name: install-cicd-agent
    image: node:20-alpine
    commands:
      - cd cicd-agent
      - npm install
    depends_on:
      - install-shared

  - name: test-mcp-server
    image: node:20-alpine
    commands:
      - cd mcp-server
      - npm run test:coverage
    depends_on:
      - install-mcp-server

  - name: test-cicd-agent
    image: node:20-alpine
    commands:
      - cd cicd-agent
      - npm run test:coverage
    depends_on:
      - install-cicd-agent

  - name: build-mcp-server
    image: node:20-alpine
    commands:
      - cd mcp-server
      - npm run build
    depends_on:
      - test-mcp-server

  - name: build-cicd-agent
    image: node:20-alpine
    commands:
      - cd cicd-agent
      - npm run build
    depends_on:
      - test-cicd-agent

  - name: security-scan
    image: aquasec/trivy:latest
    commands:
      - trivy fs --severity HIGH,CRITICAL --exit-code 0 .
    depends_on:
      - clone

  - name: sonarqube-analysis
    image: sonarsource/sonar-scanner-cli:latest
    user: 0
    environment:
      SONAR_TOKEN:
        from_secret: sonar_token
    commands:
      - sonar-scanner
        -Dsonar.host.url=http://sonarqube:9000
        -Dsonar.projectKey=ci-co
        -Dsonar.projectName=ci-co
        -Dsonar.sources=mcp-server/src,cicd-agent/src,shared/src
        -Dsonar.tests=mcp-server/src,cicd-agent/src,shared/src
        -Dsonar.test.inclusions=**/*.test.ts
        -Dsonar.exclusions=**/*.test.ts
        -Dsonar.javascript.lcov.reportPaths=mcp-server/coverage/lcov.info,cicd-agent/coverage/lcov.info,shared/coverage/lcov.info
        -Dsonar.sourceEncoding=UTF-8
        -Dsonar.token=$SONAR_TOKEN
    depends_on:
      - build-mcp-server
      - build-cicd-agent
      - test-shared

trigger:
  branch:
    - main
    - master
  event:
    - push
    - pull_request
    - custom
