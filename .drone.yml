kind: pipeline
type: docker
name: default

clone:
  disable: true

steps:
  - name: clone
    image: alpine/git
    commands:
      - git clone http://gitea:3000/localadmin/ci-co.git .
      - git checkout $DRONE_COMMIT

  - name: install-mcp-server
    image: node:20-alpine
    commands:
      - cd mcp-server
      - npm install
    depends_on:
      - clone

  - name: install-cicd-agent
    image: node:20-alpine
    commands:
      - cd cicd-agent
      - npm install
    depends_on:
      - clone

  - name: build-mcp-server
    image: node:20-alpine
    commands:
      - cd mcp-server
      - npm run build
    depends_on:
      - install-mcp-server

  - name: build-cicd-agent
    image: node:20-alpine
    commands:
      - cd cicd-agent
      - npm run build
    depends_on:
      - install-cicd-agent

  - name: security-scan
    image: aquasec/trivy:latest
    commands:
      - trivy fs --severity HIGH,CRITICAL --exit-code 0 .
    depends_on:
      - clone

trigger:
  branch:
    - main
    - master
  event:
    - push
    - pull_request
    - custom
