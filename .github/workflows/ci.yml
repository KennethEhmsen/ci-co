name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: |
            shared/package-lock.json
            mcp-server/package-lock.json
            cicd-agent/package-lock.json

      - name: Install shared dependencies
        working-directory: shared
        run: npm ci

      - name: Build shared library
        working-directory: shared
        run: npm run build

      - name: Test shared library
        working-directory: shared
        run: npm test

      - name: Install mcp-server dependencies
        working-directory: mcp-server
        run: npm ci

      - name: Build mcp-server
        working-directory: mcp-server
        run: npm run build

      - name: Test mcp-server
        working-directory: mcp-server
        run: npm test

      - name: Install cicd-agent dependencies
        working-directory: cicd-agent
        run: npm ci

      - name: Build cicd-agent
        working-directory: cicd-agent
        run: npm run build

      - name: Test cicd-agent
        working-directory: cicd-agent
        run: npm test

  coverage:
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'
          cache-dependency-path: |
            shared/package-lock.json
            mcp-server/package-lock.json
            cicd-agent/package-lock.json

      - name: Install and build shared
        working-directory: shared
        run: |
          npm ci
          npm run build

      - name: Install and build mcp-server
        working-directory: mcp-server
        run: |
          npm ci
          npm run build

      - name: Install and build cicd-agent
        working-directory: cicd-agent
        run: |
          npm ci
          npm run build

      - name: Run coverage - shared
        working-directory: shared
        run: npm run test:coverage

      - name: Run coverage - mcp-server
        working-directory: mcp-server
        run: npm run test:coverage

      - name: Run coverage - cicd-agent
        working-directory: cicd-agent
        run: npm run test:coverage
