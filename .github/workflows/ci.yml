name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: |
          rm -f package-lock.json shared/package-lock.json mcp-server/package-lock.json cicd-agent/package-lock.json
          npm install

      - name: Build
        run: npm run build

      - name: Run linting
        run: npm run lint

      - name: Run tests
        run: npm test

  coverage:
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20.x

      - name: Install dependencies
        run: |
          rm -f package-lock.json shared/package-lock.json mcp-server/package-lock.json cicd-agent/package-lock.json
          npm install

      - name: Build
        run: npm run build

      - name: Run coverage
        run: npm run test:coverage
